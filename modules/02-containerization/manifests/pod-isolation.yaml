# A busybox pod with a shell, used to look at namespaces and cgroups.
apiVersion: v1
kind: Pod
metadata:
  name: isolation
  namespace: kcna-images
spec:
  containers:
    - name: shell
      image: busybox:1.37
      command: ["sleep", "3600"]
      resources:
        requests:
          cpu: 100m
          memory: 32Mi
        limits:
          cpu: 250m
          memory: 64Mi
